name: Bootstrap source import

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect staged transfer
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/archive.b64
          base64 --decode .bootstrap/archive.b64 > /tmp/workflow-debug-local.tar.xz
          wc -c /tmp/workflow-debug-local.tar.xz
          xz --test /tmp/workflow-debug-local.tar.xz

      - name: Reconstruct and verify source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workflow-debug-local-import
          tar -xJf /tmp/workflow-debug-local.tar.xz -C /tmp/workflow-debug-local-import
          test -f /tmp/workflow-debug-local-import/workflow-debug-local/pom.xml
          test -f /tmp/workflow-debug-local-import/workflow-debug-local/agent/pom.xml
          test -f /tmp/workflow-debug-local-import/workflow-debug-local/bridge/pom.xml
          test -f /tmp/workflow-debug-local-import/workflow-debug-local/sidecar/pom.xml
          test -f /tmp/workflow-debug-local-import/workflow-debug-local/scripts/validate-workbench-e2e.sh

      - name: Replace branch with source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/workflow-debug-local-import/workflow-debug-local/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import evidence-driven workflow debug workbench'
          git push --force origin HEAD:agent/initial-evidence-driven-import
